{% extends 'client/base.html' %}
{% load my_tags %}
{% block content %}


<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            <a href="{% url 'client:message_create' %}" class="btn btn-primary mb-3"> Создать сообщение</a>
            {% for message in object_list %}
            <div class="col">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <p>{{ message.subject }} </p>
                        <p>{{ message.body }} </p>


                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a class="btn btn-secondary" href="{% url 'client:message_update' message.pk %}"
                                   role="button">Редактировать</a>
                                <a class="btn btn-primary" href="{% url 'client:message_detail' message.pk %}"
                                   role="button">Посмотреть</a>
                                <a class="btn btn-warning" href="{% url 'client:message_delete' message.pk %}"
                                   role="button">Удалить</a>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
