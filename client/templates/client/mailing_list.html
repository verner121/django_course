{% extends 'client/base.html' %}
{% load my_tags %}
{% block content %}


<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            <a href="{% url 'client:mailing_create' %}" class="btn btn-primary mb-3"> Создать рассылку</a>
            {% for mailing in object_list %}
            <div class="col">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <p class="card-text">Рассылка - {{ mailing.pk }}, статус: {{ mailing.is_status }} </p>


                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a class="btn btn-secondary" href="{% url 'client:mailing_update' mailing.pk %}"
                                   role="button">Редактировать</a>
                                <a class="btn btn-primary" href="{% url 'client:mailing_detail' mailing.pk %}"
                                   role="button">Посмотреть</a>
                                <a class="btn btn-warning" href="{% url 'client:mailing_delete' mailing.pk %}"
                                   role="button">Удалить</a>


                            </div>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
