{% extends 'client/base.html' %}
{% load my_tags %}
{% block content %}


<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
           <a href="{% url 'client:client_create' %}" class="btn btn-primary mb-3"> Создать клиента</a>
            {% for client in object_list %}
            <div class="col">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <p class="card-text">{{ client.first_name }} {{ client.last_name }} </p>
                        <p>{{ client.email  }} </p>

                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a class="btn btn-secondary" href="{% url 'client:client_update' client.pk %}"
                                   role="button">Редактировать</a>
                                <a class="btn btn-primary" href="{% url 'client:client_detail' client.pk %}"
                                   role="button">Посмотреть</a>
                                <a class="btn btn-warning" href="{% url 'client:client_delete' client.pk %}"
                                   role="button">Удалить</a>


                            </div>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
